name: Vela CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
# Gitea 1.25 ignores concurrency; release-lock.mjs serializes each environment.
jobs:
  ci: # 1. 本地测试与构建；保留保护分支要求的 ci 检查名称
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run catalog:check
      - run: npm run lint
      - run: npm run api:check
      - name: API compatibility against PR base
        if: github.event_name == 'pull_request'
        env:
          API_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          node --import ./scripts/register-ts.mjs scripts/catalog-check.mjs --baseline="$API_BASE_SHA"
          if git cat-file -e "$API_BASE_SHA:docs/openapi.json" 2>/dev/null; then
            git show "$API_BASE_SHA:docs/openapi.json" > "$RUNNER_TEMP/vela-openapi-base.json"
            node --import ./scripts/register-ts.mjs scripts/api-contract.mjs docs/openapi.json --check --baseline="$RUNNER_TEMP/vela-openapi-base.json"
          else
            echo 'First API contract: establishing reviewed baseline'
          fi
      - run: npm test
      - run: npm run test:prompts
      - name: Real Firestore Rules and quota transaction emulator tests
        run: npx --yes firebase-tools@15.36.0 emulators:exec --only auth,firestore --project demo-vela-ci --config firebase.ci.json "npm run test:rules && npm run test:api-emulator && npm run test:pat-emulator && npm run test:stripe-emulator"
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/vela-browser" --no-package-lock --ignore-scripts playwright-core@1.62.1
          node "$RUNNER_TEMP/vela-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Browser regressions (mocked data, no paid calls)
        run: PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/vela-browser/node_modules/playwright-core" ARTIFACT_DIR=artifacts/browser npm run test:ci-ui
      - run: npm run build && npm --workspace apps/api run build
      - name: Token settings browser regressions
        run: PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/vela-browser/node_modules/playwright-core" npm run test:pat-ui
      - name: Real Functions and browser API integration
        run: |
          FIRESTORE_DATABASE_ID='(default)' OTEL_SDK_DISABLED=true METADATA_SERVER_DETECTION=none PLAYWRIGHT_CORE_PATH="$RUNNER_TEMP/vela-browser/node_modules/playwright-core" npx --yes firebase-tools@15.36.0 emulators:exec --only functions,auth,firestore --project demo-vela-ci --config firebase.api-ci.json "npm run test:api-functions && npm run test:api-browser"
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v3
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ci-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
