<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Vela 出生档案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#e0b64a}a:hover{color:#f7d57f}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #070812; color: #f8fafc; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px; padding: 14px 40px; border-bottom: 1px solid #1e2740">
<a href="Catalog.dc.html" style="font-family: 'Cinzel', Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: 0.32em; color: #e0b64a; text-decoration: none; padding: 10px 0">VELA</a>
<nav style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 15px; flex: 1">
<a href="Catalog.dc.html" style="color: #c3cde0; text-decoration: none; padding: 12px 14px; border-bottom: 2px solid transparent">咨询</a>
<a href="Profiles.dc.html" aria-current="page" style="color: #f8fafc; text-decoration: none; padding: 12px 14px; border-bottom: 2px solid #e0b64a">档案</a>
<a href="Account.dc.html" style="color: #c3cde0; text-decoration: none; padding: 12px 14px; border-bottom: 2px solid transparent">账号</a>
</nav>
<a href="Account.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #26304d; border-radius: 22px; color: #f8fafc; text-decoration: none; font-size: 14px">
<span style="font-family: 'IBM Plex Mono', monospace; color: #f7d57f">1 / 3</span>
<span style="color: #c3cde0">本月已用 · 免费档</span>
</a>
</header>

<main style="flex: 1; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 48px 40px 64px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px 48px">

<section style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 32px">出生档案</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.8; color: #c3cde0">排盘只需要出生时间与地点。可以为自己和亲友各建一份。</p>

<nav style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<a href="Profiles.dc.html" aria-current="page" style="display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; background: #1d1a0f; border: 1.5px solid #e0b64a; border-radius: 12px; color: #f8fafc; text-decoration: none">
<span style="font-size: 16px; font-weight: 700">本人</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #c3cde0">1994-06-03 08:20 · 多伦多</span>
</a>
<a href="Profiles.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; background: #101527; border: 1.5px solid #26304d; border-radius: 12px; color: #f8fafc; text-decoration: none">
<span style="font-size: 16px; font-weight: 700">妈妈</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #c3cde0">1966-11-21 23:05 · 台北</span>
</a>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: transparent; border: 1.5px dashed #3a4668; border-radius: 12px; color: #e0b64a; font-family: inherit; font-size: 15px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
新建档案
</button>
</nav>
</section>

<form style="flex: 999 1 520px; min-width: 0; max-width: 680px; display: flex; flex-direction: column; gap: 24px; padding: 32px; box-sizing: border-box; background: #101527; border: 1px solid #26304d; border-radius: 16px">
<h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700">编辑档案</h2>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="p-name" style="font-size: 14px; color: #c3cde0">称呼</label>
<input id="p-name" type="text" value="本人" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; background: #070812; border: 1px solid #3a4668; border-radius: 10px; color: #f8fafc; font-family: inherit; font-size: 16px">
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="p-date" style="font-size: 14px; color: #c3cde0">出生日期</label>
<input id="p-date" type="date" value="1994-06-03" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; background: #070812; border: 1px solid #3a4668; border-radius: 10px; color: #f8fafc; color-scheme: dark; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="p-time" style="font-size: 14px; color: #c3cde0">出生时间（当地时间）</label>
<input id="p-time" type="time" value="08:20" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; background: #070812; border: 1px solid #3a4668; border-radius: 10px; color: #f8fafc; color-scheme: dark; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
</div>
</div>
<p style="margin: -12px 0 0; font-size: 13px; line-height: 1.7; color: #a3b0c5">出生时间精确到分钟，上升点与宫位才可靠。不确定时可先填大致时间，对话中会提示哪些结论受影响。</p>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="p-city" style="font-size: 14px; color: #c3cde0">出生城市</label>
<input id="p-city" type="search" value="Toronto" autocomplete="off" style="min-height: 48px; padding: 0 14px; box-sizing: border-box; background: #070812; border: 1.5px solid #e0b64a; border-radius: 10px; color: #f8fafc; font-family: inherit; font-size: 16px">
<ul style="margin: 0; padding: 6px; list-style: none; background: #161d33; border: 1px solid #3a4668; border-radius: 10px; display: flex; flex-direction: column; gap: 2px">
<li>
<button type="button" aria-pressed="true" style="width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; min-height: 48px; padding: 6px 12px; background: #1d2540; border: 0; border-radius: 8px; color: #f8fafc; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer">
<span>多伦多，安大略省，加拿大</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #c3cde0">43.65°N 79.38°W · America/Toronto</span>
</button>
</li>
<li>
<button type="button" aria-pressed="false" style="width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; min-height: 48px; padding: 6px 12px; background: transparent; border: 0; border-radius: 8px; color: #c3cde0; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer">
<span>多伦多，俄亥俄州，美国</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a3b0c5">40.46°N 80.60°W · America/New_York</span>
</button>
</li>
</ul>
<p style="margin: 0; font-size: 13px; line-height: 1.7; color: #a3b0c5">经纬度与时区由城市自动确定，无需手填。</p>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; color: #c3cde0">性别（仅紫微斗数需要，可不填）</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid #3a4668; border-radius: 10px; font-size: 15px; cursor: pointer"><input type="radio" name="gender" checked style="width: 18px; height: 18px; margin: 0; accent-color: #e0b64a">女</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid #3a4668; border-radius: 10px; font-size: 15px; cursor: pointer"><input type="radio" name="gender" style="width: 18px; height: 18px; margin: 0; accent-color: #e0b64a">男</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid #3a4668; border-radius: 10px; font-size: 15px; cursor: pointer"><input type="radio" name="gender" style="width: 18px; height: 18px; margin: 0; accent-color: #e0b64a">不填</label>
</div>
</fieldset>

<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.7; color: #c3cde0; cursor: pointer">
<input type="checkbox" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #e0b64a; flex: none">
<span>这是他人的出生信息，我已获得对方同意。</span>
</label>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 1px solid #26304d">
<button type="button" style="min-height: 48px; padding: 0 16px; background: transparent; border: 0; color: #ff9d8a; font-family: inherit; font-size: 15px; cursor: pointer">删除此档案</button>
<div style="display: flex; gap: 12px">
<button type="button" style="min-height: 48px; padding: 0 20px; background: transparent; border: 1px solid #3a4668; border-radius: 10px; color: #c3cde0; font-family: inherit; font-size: 15px; cursor: pointer">取消</button>
<button type="submit" style="min-height: 48px; padding: 0 28px; background: #e0b64a; border: 0; border-radius: 10px; color: #1a1405; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">保存</button>
</div>
</div>
</form>

</main>
</div>
</x-dc>

}

</body>
</html>
